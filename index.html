<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carta Romántica</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body>

  <audio id="popSound" src="assets/pop.mp3" preload="auto"></audio>
  <audio id="botonSound" src="assets/estrella.mp3" preload="auto"></audio>
  <audio id="bubbleSound" src="assets/burbujas.mp3" preload="auto"></audio>


  <div class="contenedor">
    <div class="contenido-carta">
      <div class="page" id="page">
        <div class="titulo-con-icono">
          <h1 id="titulo"></h1>
          <span id="icono-decorativo"></span>
        </div>
        <p id="mensaje"></p>
        <button id="btnSiguiente">Siguiente</button>
      </div>
    </div>

    <img src="assets/nosotros.png" alt="Nosotros estilo Ghibli" class="imagen-lateral" id="imagenPrincipal">
  </div>

  <script src="script.js"></script>
</body>
</html>
